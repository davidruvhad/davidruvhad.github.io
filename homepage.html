<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3a8a, #2563eb);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 800px;
            padding: 40px;
        }

        h1 {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.4rem;
            margin-bottom: 50px;
        }

        .btn {
            display: inline-block;
            background: white;
            color: #2563eb;
            text-decoration: none;
            padding: 20px 60px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 12px;
            transition: 0.3s;
        }

        .btn:hover {
            background: #e5e7eb;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Welcome to My Website</h1>

        <p>
            Explore my portfolio, projects, and learn more about me.
        </p>

        <a href="about.html" class="btn">
            Go to our car inventory!
        </a>

    </div>

</body>

</html>
